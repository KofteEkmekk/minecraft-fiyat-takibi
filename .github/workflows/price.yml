name: Minecraft Fiyat Kontrol

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fiyat-kontrol
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklari kur
        run: pip install requests

      - name: Fiyati kontrol et
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_PRICE: ""
        run: python check_price.py

      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name "duyuru-bot"
          git config user.email "duyuru-bot@users.noreply.github.com"
          if [ -f price_state.json ]; then
            git add price_state.json
            git diff --staged --quiet || (git commit -m "Fiyat durumu guncellendi" && git pull --rebase -q && git push)
          fi
          
